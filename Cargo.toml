[package]
name = "nixlymedia"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
futures-util = "0.3"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

libmpv2 = "4"
gilrs = "0.11"

anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
base64 = "0.22"
url = "2"
urlencoding = "2"
dirs = "5"
glow = "0.14"
libloading = "0.8"
libc = "0.2"

wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
